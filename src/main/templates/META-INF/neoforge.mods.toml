modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/keellam4/oritech-extensions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="icon.png"
displayURL="https://github.com/keellam4/oritech-extensions"
credits="Built on Oritech by Rearth. Paint support for Oritech Things (by Lumengrid and contributors, CC-BY 4.0) reads its textures at runtime."
description='''
Small add-ons for Oritech:
 - Hangar Door Extensions: make Industrial Hangar Doors up to 16 blocks long (configurable).
 - Paintable machine addons: Oritech's machine paints now work on Oritech's addons and Oritech Things' tiered addons.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="oritech"
    type="required"
    versionRange="${oritech_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.6,5)"
    ordering="AFTER"
    side="BOTH"
