plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.architectury.dev/' } }
        filter { includeGroup 'dev.architectury' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Starts the real client headless, loads all textures/models, logs paint checks, quits at the title screen.
        clientSmokeTest {
            client()
            systemProperty 'oritech_extensions.smokeTest', 'true'
        }
        // Runs every @GameTest in this mod against the real Oritech, then exits (non-zero on failure).
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Compile against Oritech and the libraries its public classes reference.
    // These are only needed at compile time; players already have them installed (ATM10 ships all three).
    compileOnly "curse.maven:oritech-1030830:${oritech_curse_file_id}"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    // Present when running the game from this project (runClient / runGameTestServer), not shipped.
    // Tests run against the newest Oritech plus Oritech Things, so compatibility with both is checked on every push.
    localRuntime "maven.modrinth:oritech:${oritech_runtime_version_id}"
    localRuntime "maven.modrinth:oritech-things:${oritech_things_runtime_version_id}"
    // Oritech's client-only connected-textures library; needed to start the client (pass -Pathena_version_id=<modrinth id>).
    if (project.hasProperty('athena_version_id')) {
        localRuntime "maven.modrinth:athena-ctm:${project.athena_version_id}"
    }
    localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
}

// Author wiki pages under wiki/; ship them as Oracle Index books without duplicating into src/.
def oracleWikiOut = layout.buildDirectory.dir('generated/oracleWiki')
tasks.register('syncOracleWiki', Copy) {
    from('wiki') {
        into 'assets/oracle_index/books/oritech_extensions'
    }
    into oracleWikiOut
}
sourceSets.main.resources.srcDir oracleWikiOut
tasks.named('processResources').configure {
    dependsOn('syncOracleWiki')
}
neoForge.ideSyncTask tasks.named('syncOracleWiki')

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            oritech_version_range  : oritech_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
