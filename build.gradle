plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
        filter { includeGroup 'com.geckolib' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.teamresourceful.com/repository/maven-public/' } }
        filter { includeGroup 'earth.terrarium.athena' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Starts the real client headless, loads all textures/models, logs paint checks, quits at the title screen.
        clientSmokeTest {
            client()
            systemProperty 'oritech_extensions.smokeTest', 'true'
        }
        // Runs every @GameTest in this mod against the real Oritech, then exits (non-zero on failure).
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Compile against Oritech 2.0 and GeckoLib; players already have both (FTB Evolution 2 ships them).
    compileOnly "maven.modrinth:oritech:${oritech_version}"
    compileOnly "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Present when running the game from this project (runClient / runGameTestServer), not shipped.
    localRuntime "maven.modrinth:oritech:${oritech_version}"
    localRuntime "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Oritech's client-only connected-textures library.
    localRuntime "earth.terrarium.athena:athena-neoforge-26.1:${athena_version}"
    // Optional in-game wiki viewer, to test the guide book in runClient (pass -Poracle_index_version_id=<modrinth id>).
    if (project.hasProperty('oracle_index_version_id')) {
        localRuntime "maven.modrinth:oracle-index:${project.oracle_index_version_id}"
    }
}

// Prints the jars on the compile classpath (used by the API probe workflow).
tasks.register('printCompileClasspath') {
    def files = configurations.compileClasspath
    doLast { files.each { println "CP ${it}" } }
}

// Author wiki pages under wiki/; ship them as Oracle Index books without duplicating into src/.
def oracleWikiOut = layout.buildDirectory.dir('generated/oracleWiki')
tasks.register('syncOracleWiki', Copy) {
    from('wiki') {
        into 'assets/oracle_index/books/oritech_extensions'
        exclude 'README.md'     // contributor notes for GitHub, not a wiki page
        exclude 'developers/**' // developer docs are website-only
    }
    into oracleWikiOut
}
sourceSets.main.resources.srcDir oracleWikiOut
tasks.named('processResources').configure {
    dependsOn('syncOracleWiki')
}
neoForge.ideSyncTask tasks.named('syncOracleWiki')

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            oritech_version_range  : oritech_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
