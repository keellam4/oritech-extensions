name: Docs

# Builds the website from wiki/ and publishes it to GitHub Pages: https://keellam4.github.io/oritech-extensions/
# Pull requests only check that wiki/ is valid and the site builds; pushes to main also deploy it.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [wiki/**, tools/wiki/**, src/main/resources/assets/**, src/main/resources/data/**, src/main/java/**/client/IconExporter.java, gradle.properties, .github/workflows/docs.yml]
  pull_request:
    paths: [wiki/**, tools/wiki/**, src/main/resources/data/**/recipe/**, src/main/java/**/client/IconExporter.java, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/wiki/requirements.txt

      - name: Install MkDocs and Pillow
        run: pip install -q -r tools/wiki/requirements.txt

      - name: Install three.js (3D paint viewer)
        run: npm install --no-save --silent --prefix build/npm three@0.170.0

      # Vanilla + Oritech jars, for item icons in recipes. Only used to build the site; never committed.
      - uses: actions/cache@v4
        with:
          path: build/wiki-cache
          key: wiki-jars-${{ hashFiles('gradle.properties') }}

      - name: Fetch game jars for item icons
        run: python3 tools/wiki/fetch_assets.py

      # Render the items the wiki shows with the real game client, so 3D/GeckoLib items get proper icons.
      # If this fails the site still builds, using icons drawn from textures instead.
      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Render item icons (headless client)
        continue-on-error: true
        run: |
          python3 tools/wiki/build_site.py --list-items
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          athena=$(curl -sfG "https://api.modrinth.com/v2/project/athena-ctm/version" \
                     --data-urlencode 'loaders=["neoforge"]' --data-urlencode 'game_versions=["1.21.1"]' | jq -r '.[0].id')
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientIconExport -Pathena_version_id="$athena" || true
          grep "\[icons\]" run/logs/latest.log || { echo "::warning::item icons were not rendered"; tail -60 run/logs/latest.log; }

      - name: Check wiki/ and generate the site source
        run: python3 tools/wiki/build_site.py

      - name: Build the site
        run: mkdocs build --strict -f build/wiki-site/mkdocs.yml

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/wiki-site/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
