name: API probe (26.1, temporary)

# Prints Minecraft / NeoForge / dependency sources listed in probe/classes.txt, for porting work
# done where the Minecraft sources can't be downloaded. Remove once the 26.1 port is done.
on:
  push:
    branches: ['26.1']
    paths: ['probe/**', '.github/workflows/api-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decompile Minecraft + NeoForge
        run: ./gradlew createMinecraftArtifacts printCompileClasspath --stacktrace | tee gradle-out.txt
      - name: Print requested sources
        run: |
          echo "jars from the decompile step:"; find build ~/.gradle/caches -path '*moddev*' -name '*.jar' 2>/dev/null | head -20
          src=$(find build ~/.gradle/caches -name '*-sources.jar' 2>/dev/null | grep -iE 'neoforge|minecraft' | head -1)
          bin=$(find build ~/.gradle/caches -path '*moddev*' -name '*.jar' 2>/dev/null | grep -vi sources | grep -iE 'neoforge-[0-9]|minecraft' | head -1)
          echo "sources: $src"; echo "binary: $bin"
          mkdir -p /tmp/src
          if [ -n "$src" ]; then (cd /tmp/src && unzip -qo "$src"); fi
          curl -sSL -o /tmp/vf.jar https://repo.maven.apache.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          cp=$(grep '^CP ' gradle-out.txt | cut -c4- | paste -sd: -)
          [ -n "$bin" ] && cp="$bin:$cp"
          classfile() { # print the decompiled source of a class (dotted name) found anywhere on the classpath
            for jar in $(echo "$cp" | tr ':' ' '); do
              path=$(echo "$1" | tr . /).class
              if unzip -l "$jar" "$path" >/dev/null 2>&1; then
                rm -rf /tmp/one /tmp/oneout; mkdir -p /tmp/one /tmp/oneout
                (cd /tmp/one && unzip -qo "$jar" "$(dirname $path)/$(basename $path .class)*.class")
                java -jar /tmp/vf.jar -din=0 -rsy=1 -log=ERROR /tmp/one /tmp/oneout >/dev/null 2>&1
                find /tmp/oneout -name "$(basename $path .class).java" -exec cat {} \;
                return
              fi
            done
            echo "(not found: $1)"
          }
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue;; esac
            kind=${line%%:*}; arg=${line#*:}
            echo "################ $line"
            case "$kind" in
              ls)   if [ -n "$src" ]; then (cd /tmp/src && find "$arg" -name '*.java' | sort); else for jar in $(echo "$cp" | tr ':' ' '); do unzip -Z1 "$jar" "$arg*" 2>/dev/null | grep '\.class$' | grep -v '\$'; done | sort -u; fi ;;
              find) if [ -n "$src" ]; then (cd /tmp/src && find . -name "$arg.java" | while read -r f; do echo "==== $f"; cat "$f"; done); else
                      for jar in $(echo "$cp" | tr ':' ' '); do unzip -Z1 "$jar" 2>/dev/null | grep -E "(^|/)$arg\.class$"; done | sort -u | while read -r c; do echo "==== $c"; classfile "$(echo ${c%.class} | tr / .)"; done; fi ;;
              grep) if [ -n "$src" ]; then (cd /tmp/src && grep -rEn "$arg" --include=*.java . | head -60); else echo "(grep needs sources)"; fi ;;
              javap) javap -cp "$cp" -public "$arg" 2>&1 | head -200 ;;
              src)  classfile "$arg" ;;
            esac
          done < probe/classes.txt
