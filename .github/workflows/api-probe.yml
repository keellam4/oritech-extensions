name: API probe (26.1, temporary)

# Prints Minecraft / NeoForge / dependency sources listed in probe/classes.txt, for porting work
# done where the Minecraft sources can't be downloaded. Remove once the 26.1 port is done.
on:
  push:
    branches: ['26.1']
    paths: ['probe/**', '.github/workflows/api-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decompile Minecraft + NeoForge
        run: ./gradlew createMinecraftArtifacts printCompileClasspath --stacktrace | tee gradle-out.txt
      - name: Print requested sources
        run: bash probe/probe.sh
