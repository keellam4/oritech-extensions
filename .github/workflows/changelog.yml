name: Changelog

# Reminds PR authors to add a line to CHANGELOG.md under [Unreleased].
# Add the "skip-changelog" label for changes players won't notice (docs, CI, refactors).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md was updated
        env:
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$SKIP_LABEL" = "true" ] || [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Changelog check skipped."
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::Add a line to CHANGELOG.md under '## [Unreleased]', or add the skip-changelog label if players won't notice this change."
            exit 1
          fi
