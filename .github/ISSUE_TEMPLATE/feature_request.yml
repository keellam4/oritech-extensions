name: Feature request
description: Suggest an improvement or a new add-on for Oritech
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it in game.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or what build would it make possible?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, screenshots, or other mods that do something similar.
