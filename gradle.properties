org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
# Lowest NeoForge accepted at runtime (ATM10 may ship an older 21.1.x than we compile against)
neo_version_range=[21.1.200,)
loader_version_range=[1,)

## Dependencies
# Oritech 1.2.9 (NeoForge) on CurseForge, project 1030830. The hangar door API used here is unchanged through 1.2.13.
oritech_curse_file_id=8426648
oritech_version_range=[1.2.0,)
# Versions used when running tests / the dev client (Modrinth version ids): Oritech 1.2.13, Oritech Things 0.0.48
oritech_runtime_version_id=BR0KKypH
oritech_things_runtime_version_id=Ol9VrRCt
geckolib_version=4.6.6
architectury_version=13.0.8

## Fabric (1.21.1). Oritech's Fabric build needs Fabric API, Architectury, Forge Config API Port, GeckoLib and Athena.
fabric_loader_version=0.20.1
fabric_api_version=0.116.18+1.21.1
# Modrinth version ids used to compile and run the Fabric build: Oritech 1.2.13, Architectury 13.0.12,
# Forge Config API Port 21.1.6, Athena 4.0.6 (connected textures, required by Oritech)
oritech_fabric_version_id=GNbpMyOn
architectury_fabric_version_id=WklfM1A0
forge_config_api_port_fabric_version_id=N5qzq0XV
athena_fabric_version_id=JfyYsWKP
# Fabric gets its own release version, so a Fabric-only release doesn't change the NeoForge file.
fabric_mod_version=0.4.1

## Mod Properties
mod_id=oritech_extensions
mod_name=Oritech Extensions
mod_license=MIT
mod_version=0.4.0
# Release channel on CurseForge / Modrinth: alpha, beta or release
release_type=beta
# Release workflow: Minecraft versions to list on Modrinth/CurseForge, and optional dependencies (project slugs).
publish_game_versions=1.21.1
publish_optional_dependencies=oritech-things,oracle-index
mod_group_id=io.github.keellam4.oritechextensions
mod_authors=keellam4
